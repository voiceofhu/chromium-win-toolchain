name: Package Chromium Windows Toolchain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-toolchain.yml"
  workflow_dispatch:
    inputs:
      include_arm64:
        description: Include ARM64 toolchain files
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Clone depot_tools
        shell: pwsh
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Patch packager for hosted runner MSVC layout
        shell: pwsh
        run: |
          $path = "depot_tools/win_toolchain/package_from_installed.py"
          $script = @'
          import pathlib
          import re

          path = pathlib.Path("depot_tools/win_toolchain/package_from_installed.py")
          text = path.read_text()
          replacement = r'''def _WildcardVersionKey(path):
              import re
              return ([int(piece) for piece in re.findall(r'\d+', path)], path.lower())


          def ExpandWildcards(root, sub_dir):
              # normpath is needed to change '/' to '\\' characters.
              path = os.path.normpath(os.path.join(root, sub_dir))
              matches = glob.glob(path)
              if len(matches) == 1:
                  return matches[0]
              if len(matches) > 1:
                  selected = sorted(matches, key=_WildcardVersionKey)[-1]
                  print('%s had %d matches; using latest %s.' %
                        (path, len(matches), selected))
                  return selected
              raise Exception('%s had %d matches - should be one' %
                              (path, len(matches)))
          '''
          pattern = r"def ExpandWildcards\(root, sub_dir\):\r?\n.*?\r?\n(?=def BuildRepackageFileList)"
          text, count = re.subn(pattern, lambda _: replacement + "\n", text, count=1, flags=re.S)
          if count != 1 or "using latest" not in text:
              raise SystemExit("Failed to patch ExpandWildcards")
          path.write_text(text)
          '@
          python -c $script
          $patched = Get-Content $path
          $start = 0
          for ($i = 0; $i -lt $patched.Length; $i++) {
            if ($patched[$i].StartsWith("def _WildcardVersionKey")) {
              $start = $i
              break
            }
          }
          $patched[$start..($start + 22)]

      - name: Package installed VS and Windows SDK
        shell: pwsh
        working-directory: depot_tools/win_toolchain
        run: |
          $args = @("package_from_installed.py", "2026", "-w", "10.0.26100.0")
          $includeArm64 = "${{ inputs.include_arm64 }}"
          if ($includeArm64 -ne "true") {
            $args += "--noarm"
          }
          python @args
          Get-ChildItem *.zip

      - name: Write usage hint
        shell: pwsh
        working-directory: depot_tools/win_toolchain
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          $hash = [System.IO.Path]::GetFileNameWithoutExtension($zip.Name)
          @"
          Download this artifact, unzip it into a local directory, then run:

            export DEPOT_TOOLS_WIN_TOOLCHAIN_BASE_URL=/path/to/toolchain-dir
            export GYP_MSVS_HASH_e66617bc68=$hash

          Then rerun:

            make build-win
          "@ | Set-Content -Encoding UTF8 usage.txt

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-win-toolchain
          path: |
            depot_tools/win_toolchain/*.zip
            depot_tools/win_toolchain/usage.txt
          compression-level: 0
          retention-days: 3

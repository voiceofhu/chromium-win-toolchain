name: Package Chromium Windows Toolchain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-toolchain.yml"
  workflow_dispatch:
    inputs:
      include_arm64:
        description: Include ARM64 toolchain files
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      # Chromium M157 build/vs_toolchain.py: SDK_VERSION and TOOLCHAIN_HASH.
      WINDOWS_SDK_VERSION: "10.0.28000.0"
      CHROMIUM_TOOLCHAIN_HASH: "3bfcb536c8"
      # winget Microsoft.WindowsSDK.10.0.28000 10.0.28000.2526; the hosted
      # image only ships the 26100 SDK.
      WINDOWS_SDK_INSTALLER_URL: "https://download.microsoft.com/download/06fc99ac-527e-451e-a536-8866695a2e7e/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe"
      WINDOWS_SDK_INSTALLER_SHA256: "02988EA51EAB2A2DB53E19735E51C97A6D221ADA74B9174FA0868870B9403BA0"
      # Chromium needs SDK Debugging Tools 10.0.26100.3323 or newer.
      MIN_DEBUGGERS_VERSION: "10.0.26100.3323"

    steps:
      - name: Install Windows SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
          $log = Join-Path $env:RUNNER_TEMP "winsdksetup.log"
          Invoke-WebRequest -Uri $env:WINDOWS_SDK_INSTALLER_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:WINDOWS_SDK_INSTALLER_SHA256) {
            throw "winsdksetup.exe SHA256 mismatch: $hash"
          }
          # "+" selects every feature, including Debugging Tools and the
          # ARM64 desktop libraries Chromium packages.
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            "/features", "+", "/quiet", "/norestart", "/ceip", "off", "/log", $log
          )
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Get-Content $log -Tail 80
            throw "winsdksetup.exe exited with $($process.ExitCode)"
          }

          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10"
          $sdk = $env:WINDOWS_SDK_VERSION
          foreach ($path in @(
            "Include\$sdk\um\windows.h",
            "Lib\$sdk\um\x64\kernel32.lib",
            "Lib\$sdk\um\arm64\kernel32.lib",
            "bin\$sdk\x64\rc.exe",
            "Debuggers\x64\dbghelp.dll"
          )) {
            if (-not (Test-Path (Join-Path $kits $path))) {
              throw "Windows SDK install is missing $path"
            }
          }
          $dbghelp = (Get-Item (Join-Path $kits "Debuggers\x64\dbghelp.dll")).VersionInfo
          $debuggers = [version]::new($dbghelp.FileMajorPart, $dbghelp.FileMinorPart, $dbghelp.FileBuildPart, $dbghelp.FilePrivatePart)
          Write-Host "Debugging Tools: $debuggers"
          if ($debuggers -lt [version]$env:MIN_DEBUGGERS_VERSION) {
            throw "Debugging Tools $debuggers is older than $env:MIN_DEBUGGERS_VERSION"
          }

      - name: Clone depot_tools
        shell: pwsh
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Patch packager for hosted runner MSVC layout
        shell: pwsh
        run: |
          $path = "depot_tools/win_toolchain/package_from_installed.py"
          $script = @'
          import pathlib
          import re

          path = pathlib.Path("depot_tools/win_toolchain/package_from_installed.py")
          text = path.read_text()
          replacement = r'''def _WildcardVersionKey(path):
              import re
              return ([int(piece) for piece in re.findall(r'\d+', path)], path.lower())


          def ExpandWildcards(root, sub_dir):
              # normpath is needed to change '/' to '\\' characters.
              path = os.path.normpath(os.path.join(root, sub_dir))
              matches = glob.glob(path)
              if len(matches) == 1:
                  return matches[0]
              if len(matches) > 1:
                  selected = sorted(matches, key=_WildcardVersionKey)[-1]
                  print('%s had %d matches; using latest %s.' %
                        (path, len(matches), selected))
                  return selected
              raise Exception('%s had %d matches - should be one' %
                              (path, len(matches)))
          '''
          pattern = r"def ExpandWildcards\(root, sub_dir\):\r?\n.*?\r?\n(?=def BuildRepackageFileList)"
          text, count = re.subn(pattern, lambda _: replacement + "\n", text, count=1, flags=re.S)
          if count != 1 or "using latest" not in text:
              raise SystemExit("Failed to patch ExpandWildcards")
          path.write_text(text)
          '@
          python -c $script
          $patched = Get-Content $path
          $start = 0
          for ($i = 0; $i -lt $patched.Length; $i++) {
            if ($patched[$i].StartsWith("def _WildcardVersionKey")) {
              $start = $i
              break
            }
          }
          $patched[$start..($start + 22)]

      - name: Package installed VS and Windows SDK
        shell: pwsh
        working-directory: depot_tools/win_toolchain
        run: |
          $args = @("package_from_installed.py", "2026", "-w", $env:WINDOWS_SDK_VERSION)
          $includeArm64 = "${{ inputs.include_arm64 }}"
          if ([string]::IsNullOrWhiteSpace($includeArm64)) {
            $includeArm64 = "true"
          }
          if ($includeArm64 -ne "true") {
            $args += "--noarm"
          }
          python @args
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Get-ChildItem *.zip
          $hasSdkHeaders = (tar -tf $zip.Name | Select-String -SimpleMatch "Windows Kits/10/Include/$env:WINDOWS_SDK_VERSION/um/windows.h")
          if (-not $hasSdkHeaders) {
            throw "Packaged toolchain is missing the $env:WINDOWS_SDK_VERSION SDK headers"
          }
          if ($includeArm64 -eq "true") {
            $hasArm64Env = (tar -tf $zip.Name | Select-String -SimpleMatch "Windows Kits/10/bin/SetEnv.arm64.json")
            if (-not $hasArm64Env) {
              throw "Packaged toolchain is missing Windows Kits/10/bin/SetEnv.arm64.json"
            }
          }

      - name: Write usage hint
        shell: pwsh
        working-directory: depot_tools/win_toolchain
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          $hash = [System.IO.Path]::GetFileNameWithoutExtension($zip.Name)
          @"
          Download this artifact, unzip it into a local directory, then run:

            export DEPOT_TOOLS_WIN_TOOLCHAIN_BASE_URL=/path/to/toolchain-dir
            export GYP_MSVS_HASH_$($env:CHROMIUM_TOOLCHAIN_HASH)=$hash

          Then rerun:

            make build-win
          "@ | Set-Content -Encoding UTF8 usage.txt

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-win-toolchain
          path: |
            depot_tools/win_toolchain/*.zip
            depot_tools/win_toolchain/usage.txt
          compression-level: 0
          retention-days: 3
